<!DOCTYPE html>
<html lang="ar" dir="rtl">
 <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تفاصيل المنتج</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />

    <link
    rel="shortcut icon"
    href="../images/bag-shopping-solid.svg"
    type="image/x-icon"
  />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../css/pages/product-details.css">
  </head>

  <body
    style="
      height: 100vh;
      display: grid;
      align-items: center;
      grid-template-rows: auto 1fr auto;
    ">    
    <header class="flex">
        <div class="logo">
          <img src="../img/1-2-2.png" alt="" style="width: 155px;
    display: block;
    margin: auto;">
        </div>

      <div class="links">
        <a class="cart" href="../index.html" title="الصفحة الرئيسية">
          <i class="fa-solid fa-house-user"></i>
        </a>
        <a class="register" href="./cart.html">
          <i class="fa-solid fa-cart-shopping"></i> المنتجات
        </a>
        <a class="sign-in" href="./signin.html">
          <i class="fa-solid fa-right-to-bracket"></i> معلومات التواصل
        </a>
        <a class="register" href="./register.html">
          <i class="fa-solid fa-user-plus"></i> حول سمو
        </a>
      </div>
    </header>

    <main class="flex">
      <!-- الصورة -->
<div class="image-box">
  <img id="product-image" src="..." alt="">
</div>

      <!-- تفاصيل المنتج -->
      <div class="product-details">
        <h2 id="product-name">اسم المنتج</h2>
        <p class="numpro">رقم المنتج: <span id="product-id">-</span></p>

        <p id="product-desc" class="description">
          سيتم عرض وصف المنتج هنا تلقائيًا.
        </p>
        

        <!-- زر الطلب عبر واتساب -->
        <a id="whatsapp-link" class="add-to-cart" target="_blank" rel="noopener noreferrer">
          <p>احصل على السعر الآن </p> 
        </a>

        <!-- زر الرجوع -->
        <br />
        <br />
        <a href="cart.html" class="back-btn">
          <i class="fa-solid fa-arrow-right"></i> الرجوع إلى صفحة المنتجات
        </a>
      </div>
    </main>

    <footer>
      تابعنا على منصات التواصل
      <a href=""><i class="fa-brands fa-square-instagram"></i></a>
      <a href=""><i class="fa-brands fa-square-facebook"></i></a>
      <a href=""><i class="fa-brands fa-square-whatsapp"></i></a>
    </footer>

<script>
  // رقم الواتساب بدون +
  const phoneNumber = "967778369862";

  // قراءة بيانات الرابط
  const params = new URLSearchParams(window.location.search);

  const name = params.get("name");
  const id   = params.get("id");
  const img  = params.get("img");
  const desc = params.get("desc");

  // تعبئة بيانات الصفحة
  if (name) document.getElementById("product-name").innerText = name;
  if (id)   document.getElementById("product-id").innerText = id;
  if (img)  document.getElementById("product-image").src = img;
  if (desc) document.getElementById("product-desc").innerText = desc;

  // إنشاء رابط واتساب
  const message =
    `السلام عليكم\n` +
    `أرغب في طلب المنتج التالي:\n` +
    `اسم المنتج: ${name}\n` +
    `رقم المنتج: ${id}`;

  const whatsappUrl =
    `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

  document.getElementById("whatsapp-link").href = whatsappUrl;
</script>
  </body>
</html>
