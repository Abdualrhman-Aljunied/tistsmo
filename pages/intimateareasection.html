<script>
  // رقم الواتساب (بدون صفر في البداية)
  const phoneNumber = "967778369862";

  // نحدد كل البطاقات (المنتجات)
  const productCards = document.querySelectorAll(".card");

  // نمر على كل بطاقة منتج
  productCards.forEach((card) => {
    const productName = card.querySelector(".title").innerText.trim();
    const productId = card.querySelector(".product-id").innerText.trim();
    const whatsappLink = card.querySelector("#whatsapp-link");

    // إنشاء الرسالة
    const message = `السلام عليكم %0Aأرغب في طلب المنتجات التالية:%0A أسم المنتج: ${productName}%0A رقم المنتج: ${productId}`;

    // إنشاء الرابط النهائي
    const url = `https://wa.me/${phoneNumber}?text=${message}`;

    // تعيين الرابط في الزر
    whatsappLink.href = url;
  });
</script>
