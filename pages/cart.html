<script>
const phoneNumber = "967778369862";

fetch('https://opensheet.elk.sh/1PSrJQ1enmQn70afVojGDLvAUKPnnNYcLtZhiOoK422U/products')
  .then(res => res.json())
  .then(products => {
    const container = document.getElementById('prod');

    products.forEach(p => {
      const message = `السلام عليكم%0Aأرغب في طلب المنتج التالي:%0Aاسم المنتج: ${p.name}%0Aرقم المنتج: ${p.code}`;
      const whatsappURL = `https://wa.me/${phoneNumber}?text=${message}`;

      container.innerHTML += `
        <article class="card">
          <a href="product-details.html?name=${encodeURIComponent(p.name)}&id=${p.code}&img=${encodeURIComponent(p.image)}&desc=${encodeURIComponent(p.description)}">
            <img width="266" src="${p.image}" alt="${p.name}">
          

          <div style="width:266px" class="content">
            <h1 class="title">${p.name}</h1>
            <p class="description">${p.description}</p>

            <div class="flex" style="justify-content: space-between; padding-bottom:0.7rem">
              <div class="price">
                رقم المنتج: <span class="product-id">${p.code}</span>
              </div>

              <a class="add-to-cart flex" href="${whatsappURL}" target="_blank">
                <i class="fa-solid fa-cart-plus"></i>
                احصل على السعر الآن
              </a>
            </div>
          </div>
          </a>
        </article>
      `;
    });
  })
  .catch(err => console.error(err));
