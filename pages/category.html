<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/pages/index.css">
      <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
      <link
      rel="shortcut icon"
      href="../images/bag-shopping-solid.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="../css/pages/index.css" />


</head>
<body
  style="
    height: 100vh;
    display: grid;
    align-items: center;
    grid-template-rows: auto 1fr auto;
  "
>

    <header class="flex">
        <div class="logo">
          <img src="../img/1-2-2.png" alt="" style="width: 155px;
    display: block;
    margin: auto;">
        </div>

      <div class="links">
        <a style="position: relative" class="cart" href="../index.html">
          <i style="margin-right: -9px;" class="fa-solid fa-house-user"></i>
        </a>
        <a class="register" href="./cart.html">
          <i class="fa-solid fa-cart-shopping"></i>
          المنتجات
        </a>
        <a class="sign-in" href="./signin.html">
          <i class="fa-solid fa-right-to-bracket"></i>
          معلومات التواصل</a
        >
        <a class="register" href="./register.html">
          <i class="fa-solid fa-user-plus"></i>
          حول سمو</a
        >
      </div>
    </header>


  <main>
    <h1 class="recommended" id="category-title">القسم</h1>

    <section class="products flex" id="prod"></section>
  </main>

<script>
/* =========================
   إعدادات عامة
========================= */
const phoneNumber = "967778369862";
const container = document.getElementById("prod");

// قراءة اسم القسم من الرابط (إن وجد)
const params = new URLSearchParams(window.location.search);
const category = params.get("cat"); // مثال: mouth, body, hair ...

/* =========================
   جلب البيانات من Google Sheet
========================= */
fetch("https://opensheet.elk.sh/1PSrJQ1enmQn70afVojGDLvAUKPnnNYcLtZhiOoK422U/products")
  .then(res => res.json())
  .then(products => {

    // إذا كنا في صفحة قسم → فلترة
    if (category) {
      products = products.filter(p => p.category === category);
    }

    // إنشاء الكروت
    products.forEach(p => {

      const card = document.createElement("article");
      card.className = "card";

      card.innerHTML = `
<a href="product-details.html?name=${encodeURIComponent(p.name)}
&id=${encodeURIComponent(p.code)}
&desc=${encodeURIComponent(p.description)}
&img=${encodeURIComponent(p.image)}">

  <img width="266" src="${p.image}" alt="${p.name}">

  <div style="width: 266px" class="content">
    <h1 class="title">${p.name}</h1>

    <p class="description">
      ${p.description}
    </p>

    <div class="flex" style="justify-content: space-between; padding-bottom: 0.7rem">
      <div class="price">
        رقم المنتج: <span class="product-id">${p.code}</span>
      </div>

      <a class="add-to-cart flex whatsapp-link" target="_blank">
        <i class="fa-solid fa-cart-plus"></i>
        احصل على السعر الآن
      </a>
    </div>
  </div>

</a>
`;

      /* =========================
         إنشاء رابط واتساب
      ========================= */
      const message =
        `السلام عليكم\nأرغب في طلب المنتج التالي:\n` +
        `اسم المنتج: ${p.name}\n` +
        `رقم المنتج: ${p.code}`;

      const whatsappURL =
        `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

      card.querySelector(".whatsapp-link").href = whatsappURL;

      container.appendChild(card);
    });
  })
  .catch(err => {
    console.error("خطأ في جلب المنتجات:", err);
  });
</script>

</body>
</html>
